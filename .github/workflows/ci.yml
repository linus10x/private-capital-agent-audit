name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test-property]"
      - name: Lint (ruff)
        run: ruff check src/ tests/ scripts/
      - name: Format check (ruff)
        run: ruff format --check src/ tests/ scripts/
      - name: Type-check (mypy --strict)
        run: mypy --strict src/private_capital_agent_audit/
      - name: Test + coverage gate
        run: pytest --cov=src/private_capital_agent_audit --cov-fail-under=90

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test-property]"
      - name: Mutation pass (load-bearing predicates)
        run: python scripts/mutation_check.py
